<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>회로이론 산업기사 기출 퀴즈</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#dfe3e8;--pr:#2457d6;--ok:#12805c;--okb:#e3f6ee;--no:#c4321c;--nob:#fdeceb;--hd:#1b2a4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--tx:#eceff3;--mu:#98a2b3;--bd:#2f353f;--pr:#7ea3ff;--ok:#4cd6a0;--okb:#12352a;--no:#ff8a78;--nob:#3b1d19;--hd:#0d1424}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2128;--tx:#eceff3;--mu:#98a2b3;--bd:#2f353f;--pr:#7ea3ff;--ok:#4cd6a0;--okb:#12352a;--no:#ff8a78;--nob:#3b1d19;--hd:#0d1424}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--hd);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.hw{max-width:680px;margin:0 auto}
.r1{display:flex;align-items:center;gap:10px}
.ib{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;flex:none}
.tt{flex:1;min-width:0}.tt small{display:block;font-size:11px;opacity:.7;letter-spacing:.04em}.tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{font-size:13px;font-weight:700;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:20px;flex:none}
.bar{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:9px 0;overflow:hidden}.bar i{display:block;height:100%;background:#7ea3ff;transition:width .25s}
.r2{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}.r2::-webkit-scrollbar{display:none}
.ch,.r2 select{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:18px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap;flex:none}
.r2 select option{color:#000}
.ch.on,.r2 select.on{background:#fff;color:#1b2a4a;border-color:#fff;font-weight:700}
main{max-width:680px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.tag{font-size:.78rem;color:var(--mu);display:flex;justify-content:space-between;margin-bottom:6px}
.q{font-size:1.05rem;font-weight:600;margin:0 0 12px;white-space:pre-line}
.fig{margin:0 auto 12px;border-radius:8px;text-align:center;overflow-x:auto}
.fig img{max-width:100%;background:#fff;border-radius:8px}
.fig.sv{background:var(--card);border:1px solid var(--bd);padding:6px;color:var(--tx)}.fig svg{width:100%;max-width:100%;height:auto}
.o{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer}
.o:active{transform:scale(.99)}.o[disabled]{cursor:default}
.o.ok{border-color:var(--ok);background:var(--okb)}.o.no{border-color:var(--no);background:var(--nob)}
.res{font-weight:700;margin-top:12px}.res.ok{color:var(--ok)}.res.no{color:var(--no)}.res.pk{color:var(--mu)}
.ex{margin-top:10px;padding:12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--pr);font-size:.92rem;white-space:pre-line}
.nav{display:flex;gap:10px;margin-top:14px}
.b{flex:1;border:1.5px solid var(--bd);background:var(--card);border-radius:10px;padding:11px;font-weight:600;cursor:pointer}
.b.p{background:var(--pr);border-color:var(--pr);color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.n{position:relative;width:40px;height:34px;border:1px solid var(--bd);border-radius:8px;background:var(--card);font-size:13px;cursor:pointer}
.n.c{background:var(--okb);border-color:var(--ok)}.n.w{background:var(--nob);border-color:var(--no)}.n.cur{outline:2px solid var(--pr)}
.n.bk::after{content:"★";position:absolute;top:-6px;right:-3px;font-size:11px;color:#e8a500}
.mu{color:var(--mu);font-size:.88rem}.empty{text-align:center;padding:30px 0}
.tools{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tw{max-width:680px;margin:0 auto;display:flex;gap:4px}
.tb{flex:1;background:none;border:0;border-radius:10px;padding:5px 0;font-size:11px;color:var(--mu);cursor:pointer;line-height:1.3}
.tb span{display:block;font-size:19px}.tb.on{color:var(--pr);background:var(--bg);font-weight:700}
#up{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:19;width:42px;height:42px;border-radius:50%;border:0;background:var(--pr);color:#fff;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}.ov.on{display:block}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--card);z-index:41;transform:translateX(-102%);transition:transform .25s;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px;overflow-y:auto}.dr.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:12px}.dh button{background:none;border:0;font-size:16px;cursor:pointer}
.ci{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.ci.cur{border-color:var(--pr)}.ci small{display:block;color:var(--mu);font-size:.75rem}.ci b{display:block}.ci em{font-style:normal;font-size:.8rem;color:var(--mu)}
.md{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:80vh;overflow-y:auto;background:var(--card);border-radius:16px;z-index:41;padding:16px;display:none}.md.on{display:block}
.fr{padding:9px 0;border-top:1px solid var(--bd);font-size:.93rem}.fr:first-of-type{border-top:0}.fr b{display:block;color:var(--pr);font-size:.8rem}
</style></head><body>
<header><div class="hw">
 <div class="r1"><button class="ib" id="mb" aria-label="메뉴">☰</button><div class="tt"><small id="sub"></small><b id="ttl"></b></div><span id="prog">0/0</span></div>
 <div class="bar"><i id="pb" style="width:0"></i></div>
 <div class="r2"><button class="ch" data-f="all">전체</button><button class="ch" data-f="wrong">오답</button><button class="ch" data-f="bm">⭐</button>
 <select id="fq"><option value="0">자주틀림▾</option><option value="24">정확률 24% 이하</option><option value="49">정확률 49% 이하</option><option value="74">정확률 74% 이하</option></select>
 <button class="ch" id="rs" title="현재 챕터 기록 초기화">↺</button></div>
</div></header>
<main><div class="card" id="card"></div><div class="grid" id="grid"></div></main>
<div class="tools"><div class="tw">
 <button class="tb" id="tsh"><span>🔀</span>순서섞기</button><button class="tb" id="tso"><span>🎲</span>보기섞기</button>
 <button class="tb" id="tbm"><span>⭐</span>북마크</button><button class="tb" id="tfm"><span>📐</span>공식모음</button><button class="tb" id="tan"><span>👁</span>정답보기</button>
</div></div>
<button id="up" aria-label="맨 위로">↑</button>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr"><div class="dh"><span>⚡ 회로이론</span><button id="dx">메뉴 ✕</button></div><div id="cl"></div></aside>
<div class="md" id="md"></div>

 상전류(환상전류) Ip = Vp/Z = 200/10 = 20[A]\n∴ 전류(부하전류) Il = √3 Ip = 20√3[A]","img":null},{"n":10,"q":"전원과 부하가 Δ-Δ결선인 평형 3상 회로의 전원전압이 200[V], 선전류가 30[A]이었다면 부하 1상의 임피던스[Ω]는?","o":["9.7","10.7","11.7","12.7"],"a":4,"e":"한 상의 임피던스 Z = Vp/Ip = Vl/(Il/√3)\n= 220/(30/√3) 식에서 Vl=200을 대입하면\n= 200√3/30 = 12.7[Ω]","img":null},{"n":12,"q":"3상 3선식에서 선간전압이 100[V]인 송전선에 5∠45°[Ω]의 부하를 Δ접속할 때의 선전류[A]는?","o":["20∠-75°","20∠-15°","34.6∠-75°","34.6∠-15°"],"a":3,"e":"상전류 Ip = Vp/Z = 100∠0°/5∠45° = 20∠-45°[A]이므로\n∴ 선전류(부하전류) Il = √3 Ip∠-30°\n= 20√3∠-75° = 34.6∠-75°[A]","img":null},{"n":19,"q":"저항 R[Ω] 3개를 Y로 접속한 회로에 전압 200[V]의 3상 교류전원을 인가 시 선전류가 10[A]라면 이 3개의 저항을 Δ로 접속하고 동일전원을 인가 시 선전류는 몇 [A]인가?","o":["10","10√3","30","30√3"],"a":3,"e":"Y결선 시 보다 Δ결선에서의 선전류가 3배 크기 때문에 30[A]가 된다.","img":null},{"n":20,"q":"R[Ω]인 3개의 저항을 같은 전원에 Δ결선에 접속시킬 때와 Y결선으로 접속시킬 때 선전류의 크기 비 (IΔ/IY)는?","o":["1/3","√6","√3","3"],"a":4,"e":"Δ결선의 선전류가 Y결선의 선전류에 비해 3배 크다.","img":null},{"n":21,"q":"Δ결선된 부하를 Y결선으로 바꾸면 소비전력은 어떻게 되는가? (단, 선간전압은 일정하다)","o":["1/3배","6배","1/√3 배","1/√6 배"],"a":1,"e":"㉠ 부하 Y결선 시\nPY = 3×E²/Z = 3×(V/√3)²/Z = V²/Z\n㉡ 부하 Δ결선 시\nPΔ = 3×E²/Z = 3×V²/Z = 3V²/Z\n∴ PY/PΔ = 1/3","img":null},{"n":26,"q":"3상 유도전동기의 출력이 3마력, 전압이 200[V], 효율 80[%], 역률 90[%]일 때 전동기에 유입하는 선전류의 값은 약 몇 [A]인가?","o":["7.18","9.18","6.85","8.97"],"a":4,"e":"유효전력 P = √3 VI cosθ η [W]\n여기서 효율 η = 출력/입력, 1[HP] = 746[W]\n∴ 선전류 I = P/(√3 V cosθ η)\n= 3×746/(√3×200×0.9×0.8) = 8.97[A]","img":null},{"n":27,"q":"선간전압 100[V], 역률 60[%]인 평형 3상 부하에서 소비전력 P=10[kW]일 때 선전류[A]는?","o":["99.4","96.2","86.2","76.4"],"a":2,"e":"선전류 I = P/(√3 V cosθ)\n= 10×10³/(√3×100×0.6) = 96.2[A]","img":null},{"n":28,"q":"부하 단자전압이 220[V]인 15[kW]의 3상 대칭부하에 3상 전력을 공급하는 선로 임피던스가 3+j2[Ω]일 때 부하가 뒤진 역률 60[%]이면 선전류[A]는?","o":["약 26.2-j19.7","약 39.36-j52.48","약 39.39-j29.54","약 19.7-j26.4"],"a":2,"e":"선전류 I = P/(√3 V cosθ)\n= 15×10³/(√3×220×0.6) = 65.61[A]\n뒤진 역률 60[%]이면\n∴ 선전류 I = I(cosθ - j sinθ)\n= 65.61(0.6 - j0.8) = 39.36 - j52.48[A]","img":null},{"n":30,"q":"한 상의 임피던스 Z=6+j8[Ω]인 평형 Y부하에 평형 3상 200[V]를 인가할 때 무효전력은 약 몇 [Var]인가?","o":["1330","1848","2381","3200"],"a":4,"e":"한 상에 흐르는 전류\nIl = Ip = (Vl/√3)/√(R²+X²) = (200/√3)/√(6²+8²) = 20/√3 [A]\n∴ 무효전력 Pr = Q = 3Ix²X = 3I²X\n= 3×(20/√3)²×8 = 3200[Var]","img":null},{"n":31,"q":"대칭 3상 Y부하에서 각 상의 임피던스가 Z=3+j4[Ω]이고, 부하전류가 20[A]일 때 이 부하의 무효전력[Var]은?","o":["1600","2400","3600","4800"],"a":4,"e":"Y결선은 선전류(부하전류)와 상전류의 크기가 같으므로\n∴ 무효전력 Pr = Q = 3Ix²X = 3I²X\n= 3×20²×4 = 4800[Var]","img":null},{"n":32,"q":"대칭 3상 Y부하에서 각 상의 임피던스가 Z=3+j4[Ω]이고 부하전류가 20[A]일 때 이 부하에서 소비되는 전력[W]은?","o":["1200","1400","1600","3600"],"a":4,"e":"소비전력 P = 3IR²R\n= 3×20²×3 = 3600[W]","img":null},{"n":33,"q":"한 상의 임피던스가 Z=20+j10[Ω]인 Y결선부하에 대칭 3상 선간전압 200[V]를 가할 때 전 소비전력은 얼마인가?","o":["800[W]","1200[W]","1600[W]","2400[W]"],"a":3,"e":"한 상에 흐르는 전류 Ip = Vp/Z\n= (200/√3)/√(20²+10²) = 5.164[A]\n∴ 소비전력 P = 3IR²R\n= 3×5.164²×20 = 1600[W]","img":null},{"n":35,"q":"3상 평형부하가 있다. 이것의 선간전압은 200[V], 선전류는 10[A]이고, 부하의 소비전력은 4[kW]이다. 이 부하의 등가 Y회로의 각 상의 저항[Ω]은 얼마인가?","o":["8","13.3","15.6","18.3"],"a":2,"e":"소비전력 P = 3I²R[W]\n∴ 각 상의 저항 R = P/3I²\n= 4000/(3×10²) = 13.3[Ω]","img":null},{"n":37,"q":"한 상의 임피던스가 6+j8[Ω]인 Δ부하에 대칭 선간전압 200[V]를 인가 시 3상 전력은 몇 [W]인가?","o":["2400","4157","7200","12470"],"a":3,"e":"상전류 Ip = Vp/Z = Vl/√(R²+X²)\n= 200/√(6²+8²) = 20[A]\n∴ 유효전력 P = 3IR²R = 3×20²×6 = 7200[W]","img":null},{"n":38,"q":"대칭 3상 Δ부하에서 각 상의 임피던스가 Z=3+j4[Ω]이고 부하전류가 20[A]일 때 피상전력[VA]은?","o":["1800","2000","2400","2800"],"a":2,"e":"피상전력 Pa = S = 3IZ·Z 식에서\n= 3×(20/√3)²×√(3²+4²)\n= 2000[VA]","img":null},{"n":42,"q":"3대의 변압기를 Δ결선으로 운전하던 중 변압기 1대가 고장으로 제거되어 V결선으로 한 경우 공급할 수 있는 전력과 고장전 전력과의 비율[%]은 얼마인가?","o":["86.8","75.0","66.7","57.7"],"a":4,"e":"V결선의 특징\n㉠ 3상 출력: PV = √3 P[kVA]\n㉡ 이용률: V결선의 출력/변압기 2개 용량 = √3P/2P = √3/2 = 0.866 = 86.6[%]\n㉢ 출력비 PV/PΔ = √3P/3P = √3/3 = 0.577 = 57.7[%]","img":null},{"n":44,"q":"용량 30[kW]의 단상 변압기 2대를 V결선하여 역률 0.8, 전력 20[kW]의 평형 3상 부하에 전력을 공급할 때 변압기 1대가 분담하는 피상전력은 얼마인가?","o":["14.4[kVA]","15[kVA]","20[kVA]","30[kVA]"],"a":1,"e":"3상 출력 P = √3 VI cosθ에서 변압기 1대 분담용량은 VI이므로\n∴ VI = P/(√3 cosθ) = 20/(√3×0.8) = 14.14[kVA]","img":null},{"n":45,"q":"대칭 n상 성상결선에서 선간전압의 크기는 성상전압의 몇 배인가?","o":["sin(π/n)","cos(π/n)","2 sin(π/n)","2 cos(π/n)"],"a":3,"e":"대칭 n상의 성형결선에서 선간전압과 위상차\n㉠ 선간전압 Vl = 2 sin(π/n) Vp\n㉡ 위상차 θ = π/2 - π/n = π/2 (1 - 2/n)\n여기서, Vp: 성상전압","img":null},{"n":46,"q":"대칭 n상에서 선전류와 환상전류 사이의 위상차는 어떻게 되는가?","o":["n/2 (1 - π/2)","π/2 (1 - n/2)","2 (1 - 2/n)","π/2 (1 - 2/n)"],"a":4,"e":"대칭 n상의 위상차\nθ = π/2 - π/n = π/2 (1 - 2/n)","img":null},{"n":47,"q":"대칭 5상 교류에서 선간전압과 상전압 간의 위상차는 몇 도인가?","o":["27°","36°","54°","72°"],"a":3,"e":"위상차 θ = π/2 - π/n = π/2 (1 - 2/n)\n= 180/2 (1 - 2/5) = 54°","img":null},{"n":49,"q":"대칭 6상 성형(star) 결선에서 상전압이 200[V]일 때 선간전압은?","o":["200[V]","150[V]","100[V]","50[V]"],"a":1,"e":"성형결선 시 선간전압\nEL = 2 sin(π/n) Ep = 2 sin(π/6) Ep = Ep\n∴ 6상에서 성형결선에서는 상전압과 선간전압이 같고, 환상결선에서는 상전류와 선전류가 같다.","img":null},{"n":50,"q":"대칭 10상 식의 환상전압이 100[V]일 때 성형전압[V]은? (단, sin18°=0.309)","o":["161.8","172","183.1","193"],"a":1,"e":"선간전압 Vl = 2 sin(π/n) Vp\n∴ 상전압 Vp = Vl/(2 sin(π/10))\n= 100/(2 sin18°) = 100/(2×0.309) = 161.8[V]","img":null},{"n":54,"q":"2전력계법을 써서 대칭평형 3상 전력을 측정하였더니 각 전력계가 500[W], 300[W]를 지시하였다. 전전력은 얼마인가? (단, 부하의 위상각은 60°보다 크며 90°보다 작다고 한다)","o":["200[W]","300[W]","500[W]","800[W]"],"a":4,"e":"유효전력(소비전력) P = W1 + W2 = 500 + 300 = 800[W]","img":null},{"n":56,"q":"단상 전력계 2개로 3상 전력을 측정하고자 한다. 전력계의 지시가 200[W], 100[W]를 가리켰다고 한다. 부하의 역률은 몇 [%]인가?","o":["94.8","86.6","50.0","31.6"],"a":2,"e":"역률 cosθ = P/Pa = (W1+W2)/(2√(W1²+W2²-W1W2))\n= (200+100)/(2√(200²+100²-200×100))\n= 0.866 ≒ 86.6[%]","img":null},{"n":57,"q":"2개의 전력계로 평형 3상 부하의 전력을 측정하였더니 한쪽 지시가 다른 쪽 전력계 지시의 3배였다면 부하역률 cosθ는?","o":["0.76","1","3","0.4"],"a":1,"e":"2전력계법 시험패턴\n측정전력이 3배(W1=3W2) 차이나는 경우 cosθ = 0.76","img":null},{"n":58,"q":"3상 전력을 측정하는 데 두 전력계 중에서 하나가 0이었다. 이때의 역률은 얼마인가?","o":["0.5","0.8","0.6","0.4"],"a":1,"e":"2전력계법 시험패턴\n측정전력이 둘 중 하나가 0인 경우 cosθ = 0.5","img":null},{"n":61,"q":"다음의 대칭 다상 교류에 의한 회전자계 중 잘못된 것은?", e₃.","svg":null},{"n":38,"q":"C[F]인 용량을 e(t)=E₁sin(ωt+θ₁)+E₃sin(3ωt+θ₃)[V]인 전압으로 충전할 때 몇 [A]의 전류(실효값)가 필요한가?","o":["(1/√2)√(E₁²+9E₃²)","(1/√2)√(E₁²+E₃²)","(ωC/√2)√(E₁²+9E₃²)","(ωC/√2)√(E₁²+E₃²)"],"a":3,"e":"i_C=ωCE₁sin(ωt+θ₁+90°)+3ωCE₃sin(3ωt+θ₃+90°) → I=√((ωCE₁/√2)²+(3ωCE₃/√2)²)=(ωC/√2)√(E₁²+9E₃²).","svg":null},{"n":39,"q":"R−L−C 직렬공진회로에서 제n고조파의 공진주파수 f[Hz]는?","o":["1/(2π√LC)","1/(2π√(nLC))","1/(2πn√LC)","1/(2πn²√LC)"],"a":3,"e":"공진조건 nωL=1/(nωC) → f_n=1/(2πn√LC)[Hz].","svg":null},{"n":41,"q":"기본파의 40[%]인 제3고조파와 30[%]인 제5고조파를 포함한 전압파 왜형률[%]은 얼마인가?","o":["30","50","70","90"],"a":2,"e":"THD=전 고조파 실효값/기본파 실효값=√(0.4²+0.3²)=0.5=50%.","svg":null},{"n":42,"q":"가정용 전원의 기본파가 100[V]이고 제7고조파가 기본파의 4[%], 제11고조파가 기본파의 3[%]였다면 이 전원의 일그러짐률은 몇 [%]인가?","o":["11","10","7","5"],"a":4,"e":"THD=√(0.04²+0.03²)=0.05=5%.","svg":null},{"n":43,"q":"e(t)=50+100√2 sinωt+50√2 sin2ωt+30√2 sin3ωt[V]의 왜형률은?","o":["1.0","0.58","0.8","0.3"],"a":2,"e":"THD=√(50²+30²)/100=0.5831≈0.58 (기본파 100V 기준).","svg":null},{"n":44,"q":"비정현 주기파 중 고조파의 감쇠율이 가장 작은 것은? (단, 정류파는 정현파의 정류파를 뜻함)","o":["반파정류파","삼각파","전파정류파","구형파"],"a":4,"e":"구형파는 고조파가 1/n로 서서히 감소해 고조파 성분이 가장 많이 남는다(삼각파는 1/n²로 빠르게 감소).","svg":null}]},{"title":"대칭좌표법","items":[{"n":1,"q":"3상 대칭분을 I₀, I₁, I₂라 하고 선전류 Iₐ, I_b, I_c라 할 때 I_b는?","o":["I₀ + a²I₁ + aI₂","(I₀+I₁+I₂)/3","I₀ + I₁ + I₂","I₀ + aI₁ + a²I₂"],"a":1,"e":"I_b = I₀ + a²I₁ + aI₂ 입니다.\n② 대칭분을 합성할 때는 1/3이 붙지 않습니다(1/3은 분해식).\n③ 은 Iₐ, ④ 는 I_c 의 합성식입니다.","img":null},{"n":2,"q":"대칭좌표법으로 3상 회로의 각 상 전압을 Vₐ=V₀+V₁+V₂, V_b=V₀+a²V₁+aV₂, V_c=V₀+aV₁+a²V₂ 로 표시할 때 정상분 전압 V₁은? (단, 상순은 a, b, c)","o":["(Vₐ+V_b+V_c)/3","(Vₐ + V_b∠120° + V_c∠-120°)/3","(Vₐ + V_b∠-120° + V_c∠120°)/3","(Vₐ∠120° + V_b + V_c∠-120°)/3"],"a":2,"e":"V₁=(Vₐ+aV_b+a²V_c)/3, a=1∠120°, a²=1∠-120° 이므로 ②.\n① 영상분 V₀, ③ 역상분 V₂ 의 식이고, ④ 는 위상 위치가 틀린 식입니다.","img":null},{"n":3,"q":"상순이 a, b, c인 불평형 3상 전류 Iₐ, I_b, I_c의 대칭분을 I₀, I₁, I₂라 하면 이때 대칭분과의 관계식 중 옳지 않은 것은?","o":["(Iₐ+I_b+I_c)/3","(Iₐ + I_b∠120° + I_c∠-120°)/3","(Iₐ + I_b∠-120° + I_c∠120°)/3","(-Iₐ-I_b-I_c)/3"],"a":4,"e":"① 영상분 I₀, ② 정상분 I₁, ③ 역상분 I₂ 로 모두 옳은 식입니다.\n④ 는 영상분에 (-)가 붙은 식으로 어떤 대칭분과도 일치하지 않습니다.","img":null},{"n":5,"q":"Vₐ, V_b, V_c를 3상 불평형전압이라 하면 정상전압은?","o":["(Vₐ+V_b+V_c)/3","(Vₐ + aV_b + a²V_c)/3","(Vₐ + a²V_b + aV_c)/3","(Vₐ+V_b+V_c)/3"],"a":2,"e":"정상분 V₁ = (Vₐ + aV_b + a²V_c)/3 입니다.\n①·④ 는 영상분, ③ 은 역상분입니다.","img":null},{"n":6,"q":"3상 불평형전압을 Vₐ, V_b, V_c라고 할 때 역상전압 V₂는 얼마인가?","o":["(Vₐ+V_b+V_c)/3","(Vₐ + a²V_b + aV_c)/3","(Vₐ + aV_b + a²V_c)/3","(Vₐ + a²V_b + a²V_c)/3"],"a":2,"e":"역상분 V₂ = (Vₐ + a²V_b + aV_c)/3 입니다.\n① 영상분, ③ 정상분, ④ 는 존재하지 않는 식입니다.","img":null},{"n":7,"q":"대칭 3상 전압 Vₐ, V_b=a²Vₐ, V_c=aVₐ 일 때 a상 기준으로 한 각 대칭분 V₀, V₁, V₂는? (단, a=-1/2+j√3/2)","o":["0, Vₐ, 0","a²Vₐ, Vₐ, 0","-Vₐ, Vₐ, 0","0, a²Vₐ, aVₐ"],"a":1,"e":"V₀=(Vₐ+a²Vₐ+aVₐ)/3=0\nV₁=(Vₐ+a³Vₐ+a³Vₐ)/3=Vₐ\nV₂=(Vₐ+a⁴Vₐ+a²Vₐ)/3=0\n대칭 3상(사고 없음)에서는 정상분만 존재합니다.","img":null},{"n":8,"q":"대칭좌표법에서 사용되는 용어 중 공통인 성분을 표시하는 것은?","o":["영상분","정상분","역상분","공통분"],"a":1,"e":"각 상에 공통으로 포함되어 있는 성분은 영상분입니다. 정상분·역상분은 상순이 있는 성분이고, '공통분'이라는 용어는 쓰지 않습니다.","img":null},{"n":9,"q":"3상 4선식에서 중성선이 필요하지 않아서 중성선을 제거하여 3상 3선식을 만들기 위한 중성선에서의 조건식은 어떻게 되는가? (단, Iₐ, I_b, I_c : 각 상의 전류)","o":["불평형 3상 Iₐ+I_b+I_c = 1","불평형 3상 Iₐ+I_b+I_c = √3","불평형 3상 Iₐ+I_b+I_c = 3","평형 3상 Iₐ+I_b+I_c = 0"],"a":4,"e":"평형 3상이면 중성선 전류(Iₐ+I_b+I_c)가 0이므로 중성선을 제거할 수 있습니다. 불평형이면 중성선에 전류가 흐르므로 ①~③ 처럼 0이 아닌 값이 되어 중성선이 필요합니다.","img":null},{"n":11,"q":"다음 중 대칭 3상 △부하(비접지)에서 각 선전류를 Iₐ, I_b, I_c라 하면 전류의 영상분은 얼마인가?","o":["∞","-1","1","0"],"a":4,"e":"중성선이 없는 3상 3선식 회로에서는 Iₐ+I_b+I_c=0 이므로 영상분 I₀=(Iₐ+I_b+I_c)/3=0 입니다.","img":null},{"n":12,"q":"불평형 회로에서 영상분이 존재하는 3상 회로 구성은?","o":["△-△결선의 3상 3선식","△-Y결선의 3상 3선식","Y-Y결선의 3상 3선식","Y-Y결선의 3상 4선식"],"a":4,"e":"영상분이 존재하려면 지락 전류(중성선 전류)가 흐를 수 있어야 하므로 중성점 접지된 3상 4선식이어야 합니다. 3선식은 선전류의 합이 0이라 영상분이 없습니다.","img":null},{"n":13,"q":"대칭좌표법에 관한 설명 중 잘못된 것은?","o":["불평형 3상 회로의 접지식 회로에서는 영상분이 존재한다.","대칭 3상 전압은 정상분만 존재한다.","불평형 3상 회로의 비접지식 회로에서는 영상분이 존재한다.","대칭 3상 전압에서 영상분은 0이 된다."],"a":3,"e":"비접지식 회로는 선전류의 합이 0이어서 영상분이 존재하지 않으므로 ③이 틀린 설명입니다. 영상분은 접지식(중성선 있음)에서만 존재합니다.","img":null},{"n":14,"q":"대칭좌표법에 관한 설명 중 잘못된 것은?","o":["대칭좌표법은 일반적인 비대칭 n상 교류회로의 계산에도 이용된다.","대칭 3상 전압의 영상분과 역상분은 0이고, 정상분만 남는다.","비대칭 n상 교류회로는 영상분, 역상분 및 정상분의 3성분으로 해석한다.","비대칭 3상 회로의 접지식 회로에는 영상분이 존재하지 않는다."],"a":4,"e":"비대칭 3상 회로의 접지식 회로에는 영상분이 존재하므로 ④가 틀렸습니다. (영상분이 없는 것은 비접지식입니다.)","img":null},{"n":15,"q":"대칭좌표법에 의하여 3상 회로에 대한 해석 중 잘못된 것은?","o":["△결선이든 Y결선이든 세 선전류의 합이 영이면 영상분도 영이다.","선간전압의 합이 영이면 그 영상분은 항상 영이다.","선간전압이 평형이고 상순이 a-b-c이면 Y결선에서 상전압의 역상분은 영이 아니다.","Y결선 중성점 접지 시 중성선 정상분의 선전류에 대하여서 ∞의 임피던스를 나타낸다."],"a":3,"e":"평형(대칭) 3상 회로에서는 영상분과 역상분이 0이고 정상분만 존재합니다. 따라서 선간전압이 평형이면 Y결선 상전압의 역상분도 0이므로 ③이 틀렸습니다.","img":null},{"n":16,"q":"3상 회로에 있어서 대칭분전압이 V̇₀=-8+j3 [V], V̇₁=6-j8 [V], V̇₂=8+j12 [V]일 때 a상의 전압[V]은?","o":["6 + j7","-32.3 + j2.73","2.3 + j0.73","2.3 + j2.73"],"a":1,"e":"Vₐ = V₀+V₁+V₂ = (-8+j3)+(6-j8)+(8+j12) = 6+j7 [V]","img":null},{"n":17,"q":"각 상의 전류가 iₐ=30 sinωt [A], i_b=30 sin(ωt-90°) [A], i_c=30 sin(ωt+90°) [A]일 때 영상대칭분의 전류[A]는?","o":["10 sinωt","30 sinωt","30/√3 sinωt","10/√3 sinωt"],"a":1,"e":"I₀=(Iₐ+I_b+I_c)/3=(30+30∠-90°+30∠90°)/3 = 10∠0° → 10 sinωt [A]\n(③·④ 는 √3이 들어가는 잘못된 계산입니다.)","img":null},{"n":18,"q":"각 상전압이 Vₐ=40 sinωt [V], V_b=40 sin(ωt+90°) [V], V_c=40 sin(ωt-90°) [V]라 하면 영상대칭분의 전압[V]은?","o":["40 sinωt","(40/3) sinωt","(40/3) sin(ωt-90°)","(40/3) sin(ωt+90°)"],"a":2,"e":"V₀=(40∠0°+40∠90°+40∠-90°)/3 = 40/3 ∠0° → (40/3) sinωt [V]\n+90°와 -90° 성분은 서로 상쇄됩니다.","img":null},{"n":19,"q":"불평형 3상 전류가 Iₐ=16+j2 [A], I_b=-20-j9 [A], I_c=-2+j10 [A]일 때 영상분 전류[A]는?","o":["-2 + j","-6 + j3","-9 + j6","-18 + j9"],"a":1,"e":"I₀=(Iₐ+I_b+I_c)/3 = (16-20-2 + j(2-9+10))/3 = (-6+j3)/3 = -2+j [A]\n② 는 3으로 나누지 않은 합입니다.","img":null},{"n":20,"q":"3상 부하가 Y결선으로 되어 있다. 각 상의 임피던스는 Zₐ=3 [Ω], Z_b=3 [Ω], Z_c=3+j3 [Ω]이다. 이 부하의 영상 임피던스는 얼마인가?\n(※ 책 해설 계산에 맞춰 Z_c=3+j3 으로 표기)","o":["6 + j3 [Ω]","2 + j [Ω]","3 + j3 [Ω]","3 + j6 [Ω]"],"a":2,"e":"Z₀=(Zₐ+Z_b+Z_c)/3 = (3+3+3+j3)/3 = 2+j [Ω]","img":null},{"n":21,"q":"3상 부하가 △결선으로 되어 있다. 컨덕턴스가 a상에 0.3[℧], b상에 0.3[℧]이고, 유도 서셉턴스가 c상에 0.3[℧]가 연결되어 있을 때 이 부하의 영상 어드미턴스는?","o":["0.2 - j0.1","0.2 + j0.1","0.6 - j0.3","0.6 + j0.3"],"a":1,"e":"Y₀=(Yₐ+Y_b+Y_c)/3 = (0.3+0.3-j0.3)/3 = 0.2-j0.1 [℧]\n유도 서셉턴스는 -jB_L 이므로 허수부가 (-)입니다(②·④ 는 부호 오류, ③·④ 는 3으로 나누지 않음).","img":null},{"n":23,"q":"불평형 3상 교류회로에서 각 상의 전류가 각각 iₐ=7+j2 [A], i_b=-8-j10 [A], i_c=-4+j6 [A]일 때 전류의 대칭분 중 정상분 전류[A]는?","o":["약 8.95","약 7.75","약 3.76","약 2.53"],"a":1,"e":"I₁=(Iₐ+aI_b+a²I_c)/3 = 8.95+j0.18 [A]\n|I₁| = √(8.95²+0.18²) ≈ 8.95 [A]","img":null},{"n":24,"q":"불평형 3상 전류가 Iₐ=15+j2 [A], I_b=-20-j14 [A], I_c=-3+j10 [A]일 때 역상분 전류 I₂[A]는 얼마인가?","o":["1.91 + j6.24","15.74 - j3.57","-2.67 - j0.67","2.67 + j0.67"],"a":1,"e":"I₂=(Iₐ+a²I_b+aI_c)/3 = 1.91+j6.24 [A]\n② 는 정상분, ③ 은 영상분의 값에 해당합니다.","img":null},{"n":25,"q":"전압대칭분을 각각 V₀, V₁, V₂, 전류의 대칭분을 각각 I₀, I₁, I₂라 할 때 대칭분으로 표시되는 전전력은 얼마인가?","o":["V₀I₁ + V₁I₂ + V₂I₀","V₀I₀ + V₁I₁ + V₂I₂","3V₀I₁ + 3V₁I₂ + 3V₂I₀","3V₀I₀ + 3V₁I₁ + 3V₂I₂"],"a":4,"e":"P = Vₐ·Iₐ* + V_b·I_b* + V_c·I_c* 를 대칭분으로 전개하면 3V₀I₀ + 3V₁I₁ + 3V₂I₂ 입니다. 같은 차수끼리만 곱해지고(서로 다른 차수의 곱은 상쇄) 계수 3이 붙습니다.","img":null},{"n":26,"q":"다음 중 3상 불평형 전압에서 불평형률[%]이란?","o":["영상분/정상분 × 100","정상분/역상분 × 100","정상분/영상분 × 100","역상분/정상분 × 100"],"a":4,"e":"불평형률 = 역상분/정상분 × 100 [%] (NEMA·IEEE 정의는 (최대값-최소값)/평균값이나 실제로는 위 근사식을 사용합니다).","img":null},{"n":27,"q":"3상 불평형 전압에서 역상전압이 25[V]이고, 정상전압이 100[V], 영상전압이 10[V]라 할 때 전압의 불평형률은?","o":["0.25","0.4","4","10"],"a":1,"e":"불평형률 = 역상분/정상분 = 25/100 = 0.25 (영상분 10 V는 사용하지 않는 값입니다).","img":null},{"n":28,"q":"3상 불평형 전압이 Vₐ=80[V], V_b=-40-j30[V], V_c=-40+j30[V]라고 할 때 대칭전압 중 역상전압 V₂[V]는?","o":["0","22.7","57.3","68.1"],"a":2,"e":"V₂=(Vₐ+a²V_b+aV_c)/3 = 22.7 [V]\n③ 57.3 은 정상분 V₁ 의 값입니다.","img":null},{"n":29,"q":"다음 중 3상 회로의 선간전압이 각각 80, 50, 50[V]일 때 전압의 불평형률[%]은 대략 얼마인가?","o":["22.7","39.6","45.3","57.3"],"a":2,"e":"Vₐ=80, V_b=-40-j30, V_c=-40+j30 으로 두면 V₁=57.3, V₂=22.7 [V]\n불평형률 = 22.7/57.3 × 100 ≈ 39.6 [%]\n(22.7, 57.3 은 각각 역상분, 정상분 값입니다.)","img":null},{"n":30,"q":"3상 회로의 선간전압이 각각 120[V], 100[V], 100[V]이었다. 이때의 역상전압 V₂의 값은 약 몇 [V]인가?","o":["9.8","13.8","96.2","106.2"],"a":2,"e":"Vₐ=120, V_b=-60-j80, V_c=-60+j80 으로 두면 V₂=(Vₐ+a²V_b+aV_c)/3 ≈ 13.8 [V]\n③·④ 는 정상분(106.2) 부근 값이며 ③ 은 근거 없는 값입니다.","img":null},{"n":31,"q":"3상 회로의 선간전압이 각각 120[V], 100[V], 100[V]이었다. 불평형률[%]은?","o":["약 13","약 15","약 17","약 19"],"a":1,"e":"정상분 V₁≈106.2 [V], 역상분 V₂≈13.8 [V]\n불평형률 = 13.8/106.2 × 100 ≈ 13 [%]","img":null},{"n":32,"q":"3상 불평형 회로가 있다. 각 상전압이 Vₐ=220[V], V_b=220∠-140°[V], V_c=220∠100°[V]일 때 정상분 전압 V₁[V]은?","o":["약 197.31∠13.06°","약 197.31∠-13.36°","약 217.03∠13.06°","약 217.03∠-13.36°"],"a":4,"e":"V₁=(Vₐ+aV_b+a²V_c)/3 = 211.15-j50.16 [V]\n크기 = √(211.14²+50.16²) ≈ 217, 위상 = tan⁻¹(-50.16/211.14) = -13.36° → ④","img":null},{"n":33,"q":"대칭 3상 교류발전기의 기본식 중 알맞게 표현된 것은? (단, V₀ : 영상분 전압, V₁ : 정상분 전압, V₂ : 역상분 전압)","o":["V₀ = E₀ - Z₀I₀","V₁ = Z₁I₁","V₂ = Z₂I₂","V₁ = Eₐ - Z₁I₁"],"a":4,"e":"3상 교류발전기의 기본식\n영상분 V₀ = -Z₀I₀\n정상분 V₁ = Eₐ - Z₁I₁\n역상분 V₂ = -Z₂I₂\n(기전력은 정상분에만 존재하므로 ①·②·③ 은 틀립니다.)","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCACfAPADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD1zPQ+tAAxjmlz+66cAU1OgJOPWmMdhTye/SkBwAMUvfjnFC5GcjNACEYO4YOTzSjPTilI6c4pCBu/WgBS3PBApARng9aD7L1pcgYHTPQUDDcAeRml5z0GKQjB4I+tKnHX0oEIXOCCAKMgN0HIpOSP const FORM=[
[["Y결선","Vl = √3·Vp (30° 앞섬), Il = Ip"],["Δ결선","Vl = Vp, Il = √3·Ip (30° 뒤짐)"],["3상 전력","P = √3·Vl·Il·cosθ = 3·Vp·Ip·cosθ"],["Δ ↔ Y 변환(평형)","Z_Y = Z_Δ / 3 (Y→Δ는 3배)"],["2전력계법","P = W₁+W₂,  Q = √3(W₁−W₂),  Pa = 2√(W₁²+W₂²−W₁W₂)\ncosθ = (W₁+W₂) / (2√(W₁²+W₂²−W₁W₂))"],["2전력계 시험패턴","W₁=3W₂ → cosθ ≒ 0.76,  한쪽이 0 → cosθ = 0.5"],["n상 성형결선","Vl = 2sin(π/n)·Vp,  위상차 θ = π/2·(1−2/n)"],["n상 전력","P = n/(2sin(π/n))·Vl·Il·cosθ"],["1선 단선","나머지 2상이 단상 회로 → I = Vl / Z(합성)"],["회전자계","대칭 n상 → 원형, 비대칭 n상 → 타원형"]],
[["실효값","V = √(V₀²+V₁²+V₂²+…+Vₙ²)"],["왜형률(THD)","THD = √(V₂²+V₃²+…+Vₙ²) / V₁"],["소비전력","P = V₀I₀ + Σ Vₖ·Iₖ·cosθₖ  (같은 주파수끼리)"],["n고조파 임피던스","Zₙ = R + j(nωL − 1/(nωC))"],["n고조파 공진","nωL = 1/(nωC) → fₙ = 1 / (2πn√LC)"],["L의 저장 에너지","W = ½·L·I²  (I는 전류 실효값)"],["역률","cosθ = P / (V·I)"],["고조파 감쇠","구형파 1/n,  삼각파 1/n² (구형파가 가장 느리게 감쇠)"]],
[["a 연산자","a = 1∠120° = −½ + j√3/2,  a² = 1∠−120°\n1 + a + a² = 0,  a³ = 1"],["분해식","V₀ = (Vₐ+V_b+V_c)/3\nV₁ = (Vₐ+aV_b+a²V_c)/3\nV₂ = (Vₐ+a²V_b+aV_c)/3"],["합성식","Vₐ = V₀+V₁+V₂\nV_b = V₀+a²V₁+aV₂\nV_c = V₀+aV₁+a²V₂"],["발전기 기본식","V₀ = −Z₀I₀,  V₁ = Eₐ − Z₁I₁,  V₂ = −Z₂I₂"],["1선 지락","I₀ = Eₐ/(Z₀+Z₁+Z₂+3Z),  I_g = 3I₀"],["선간 단락","Iₐ = 0, I₀ = 0, V₁ = V₂\nI_b = (a²−a)Eₐ / (Z₁+Z₂)"],["2선 지락","V₀ = V₁ = V₂ = Vₐ/3"],["대칭 3상","정상분만 존재 (V₀ = V₂ = 0)"]]

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'),CI='①②③④';
DATA.forEach(c=>c.items.sort((a,b)=>a.n-b.n));
let st={},bm={};
try{st=JSON.parse(localStorage.getItem('jg_st')||'{}');bm=JSON.parse(localStorage.getItem('jg_bm')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('jg_st',JSON.stringify(st));localStorage.setItem('jg_bm',JSON.stringify(bm))}catch(e){}};
const orders=DATA.map(c=>c.items.map((_,i)=>i));
let ch=0,pos=0,filt='all',thr=0,shufO=false,perm={},sel={},rev={};
const key=(c,i)=>c+'_'+DATA[c].items[i].n;
const noShuf=it=>/^파형/.test(it.o[0]);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const acc=k=>{const s=st[k];return s&&s.r+s.w?Math.round(s.r/(s.r+s.w)*100):null};
function match(i){const k=key(ch,i);if(filt=='wrong')return st[k]&&st[k].l===0;if(filt=='bm')return !!bm[k];if(filt=='freq'){const a=acc(k);return a!=null&&a<=thr}return true}
const list=()=>orders[ch].filter(match);
function render(){
 const c=DATA[ch],L=list();if(pos>=L.length)pos=Math.max(0,L.length-1);
 $('#sub').textContent='회로이론 · 산업기사 기출';$('#ttl').textContent='CHAPTER 0'+(ch+1)+' · '+c.title;
 $('#prog').textContent=(L.length?pos+1:0)+'/'+L.length;$('#pb').style.width=(L.length?(pos+1)/L.length*100:0)+'%';
 document.querySelectorAll('.ch[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f==filt));
 $('#fq').classList.toggle('on',filt=='freq');$('#tso').classList.toggle('on',shufO);
 const card=$('#card');
 if(!L.length){card.innerHTML='<div class="empty mu">해당하는 문제가 없습니다.</div>';$('#grid').innerHTML='';$('#tbm').classList.remove('on');return}
 const i=L[pos],it=c.items[i],k=key(ch,i);
 let p=perm[k];if(!p){p=[0,1,2,3];if(shufO&&!noShuf(it))shuf(p);perm[k]=p}
 const s=sel[k],shown=s!=null||rev[k],cd=p.indexOf(it.a-1);
 let h='<div class="tag"><span>책 문제 번호 '+it.n+'번</span><span>'+(acc(k)!=null?'정확률 '+acc(k)+'%':'')+'</span></div><p class="q">'+esc(it.q)+'</p>';
 if(it.img)h+='<div class="fig"><img alt="문제 '+it.n+' 그림" src="'+it.img+'"></div>';
 if(it.svg)h+='<div class="fig sv">'+it.svg+'</div>';
 p.forEach((o,d)=>{let cl='o';if(shown){if(d==cd)cl+=' ok';else if(d==s)cl+=' no'}h+='<button class="'+cl+'" data-d="'+d+'"'+(shown?' disabled':'')+'>'+CI[d]+' '+esc(it.o[o])+'</button>'});
 if(shown){const ok=s===cd,e=shufO?it.e.replace(/[①②③④]/g,x=>CI[p.indexOf(CI.indexOf(x))]):it.e;
  h+='<div class="res '+(s==null?'pk':ok?'ok':'no')+'">'+(s==null?'👁 정답은 '+CI[cd]+' 입니다.':ok?'⭕ 정답입니다!':'❌ 오답입니다. 정답은 '+CI[cd]+' 입니다.')+'</div><div class="ex"><b>해설</b>\n'+esc(e)+'</div>'}
 h+='<div class="nav"><button class="b" id="pv">← 이전</button><button class="b p" id="nx">다음 →</button></div>';
 card.innerHTML=h;
 $('#tbm').classList.toggle('on',!!bm[k]);
 $('#grid').innerHTML=L.map((j,x)=>{const kk=key(ch,j),q=st[kk];return '<button class="n'+(q?(q.l?' c':' w'):'')+(x==pos?' cur':'')+(bm[kk]?' bk':'')+'" data-g="'+x+'">'+c.items[j].n+'</button>'}).join('');
}
function pick(d){const L=list(),i=L[pos],it=DATA[ch].items[i],k=key(ch,i);if(sel[k]!=null||rev[k])return;
 sel[k]=d;const ok=perm[k][d]==it.a-1,s=st[k]||(st[k]={r:0,w:0,l:1});ok?s.r++:s.w++;s.l=ok?1:0;save();render()}
const go=n=>{pos=Math.max(0,Math.min(list().length-1,n));render();scrollTo({top:0,behavior:'smooth'})};
function setCh(n){ch=n;pos=0;filt='all';$('#fq').value='0';closeAll();render();scrollTo(0,0);try{history.replaceState(null,'','#'+(n+1))}catch(e){}}
function menu(){$('#cl').innerHTML=DATA.map((c,n)=>{let t=0,r=0,w=0;c.items.forEach((_,i)=>{const s=st[key(n,i)];if(s){t++;r+=s.r;w+=s.w}});
 return '<button class="ci'+(n==ch?' cur':'')+'" data-c="'+n+'"><small>CHAPTER 0'+(n+1)+'</small><b>'+c.title+'</b><em>'+c.items.length+'문항 · 푼 문제 '+t+(r+w?' · 정확률 '+Math.round(r/(r+w)*100)+'%':'')+'</em></button>'}).join('')}
function closeAll(){['#ov','#dr','#md'].forEach(s=>$(s).classList.remove('on'))}
document.addEventListener('click',e=>{const t=e.target.closest('button,select');if(!t)return;
 if(t.dataset.d!=null)pick(+t.dataset.d);
 else if(t.dataset.g!=null)go(+t.dataset.g);
 else if(t.dataset.c!=null)setCh(+t.dataset.c);
 else if(t.dataset.f){filt=t.dataset.f;$('#fq').value='0';pos=0;render()}
 else if(t.id=='pv')go(pos-1);else if(t.id=='nx')go(pos+1);
 else if(t.id=='mb'){menu();$('#ov').classList.add('on');$('#dr').classList.add('on')}
 else if(t.id=='dx')closeAll();
 else if(t.id=='tsh'){shuf(orders[ch]);sel={};rev={};pos=0;render()}
 else if(t.id=='tso'){shufO=!shufO;perm={};sel={};rev={};render()}
 else if(t.id=='tbm'){const L=list();if(!L.length)return;const k=key(ch,L[pos]);bm[k]?delete bm[k]:bm[k]=1;save();render()}
 else if(t.id=='tan'){const L=list();if(!L.length)return;rev[key(ch,L[pos])]=1;render()}
 else if(t.id=='tfm'){$('#md').innerHTML='<div class="dh"><span>📐 공식모음 · '+DATA[ch].title+'</span><button id="mx">✕</button></div>'+FORM[ch].map(f=>'<div class="fr"><b>'+f[0]+'</b>'+esc(f[1]).replace(/\n/g,'<br>')+'</div>').join('');$('#ov').classList.add('on');$('#md').classList.add('on')}
 else if(t.id=='mx')closeAll();
 else if(t.id=='rs'){if(confirm('이 챕터의 풀이 기록과 북마크를 초기화할까요?')){DATA[ch].items.forEach((_,i)=>{const k=key(ch,i);delete st[k];delete bm[k];delete sel[k];delete rev[k]});save();filt='all';pos=0;render()}}
 else if(t.id=='up')scrollTo({top:0,behavior:'smooth'})});
$('#ov').onclick=closeAll;
$('#fq').onchange=e=>{thr=+e.target.value;filt=thr?'freq':'all';pos=0;render()};
addEventListener('scroll',()=>{$('#up').style.display=scrollY>300?'block':'none'},{passive:true});
addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(pos+1);if(e.key=='ArrowLeft')go(pos-1)});
const h0=parseInt((location.hash||'').slice(1));if(h0>=1&&h0<=DATA.length)ch=h0-1;
render();
</script></body></html>
